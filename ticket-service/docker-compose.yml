services:

  mysql:
    image: mysql:8.4
    container_name: mysql

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: empNtkt

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p12345678" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    container_name: redis

    ports:
      - "6379:6379"

  app:
    build: .
    container_name: employee-app

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: