services:

  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: empNtkt
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - employee-network

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - employee-network

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-secrets:/etc/kafka/secrets
      - kafka-config:/mnt/shared/config
    networks:
      - employee-network


  # ============================================================
  # SPRING CLOUD
  # ============================================================

  config-server:
    image: config-server
    container_name: config-server
    ports:
      - "8888:8888"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8888/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - employee-network


  discovery-server:
    image: discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"

    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

    depends_on:
      config-server:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8761/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - employee-network


  # ============================================================
  # APPLICATION SERVICES
  # ============================================================

  user-service:
    image: user-service
    container_name: user-service
    ports:
      - "8081:8081"

    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_started
      redis:
        condition: service_started

    networks:
      - employee-network


  ticket-service:
    image: ticket-service
    container_name: ticket-service
    ports:
      - "8082:8082"

    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started

    networks:
      - employee-network


  email-service:
    image: email-service
    container_name: email-service
    ports:
      - "8083:8083"

    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started

    networks:
      - employee-network


  audit-service:
    image: audit-service
    container_name: audit-service
    ports:
      - "8084:8084"

    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_started
      kafka:
        condition: service_started

    networks:
      - employee-network


  api-gateway:
    image: api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"

    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

    networks:
      - employee-network

  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    image: employee-frontend
    container_name: employee-frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - employee-network


  # ============================================================
  # OBSERVABILITY
  # ============================================================

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - user-service
      - ticket-service
      - email-service
      - audit-service
      - api-gateway

    networks:
      - employee-network


  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - employee-network


  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

    networks:
      - employee-network


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: elasticsearch

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    networks:
      - employee-network


  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.0
    container_name: kibana
    ports:
      - "5601:5601"

    depends_on:
      - elasticsearch

    networks:
      - employee-network


  fluent-bit:
    image: fluent/fluent-bit:4.1
    container_name: fluent-bit

    volumes:
      - ./monitoring/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./ticket-service/logs:/logs

    depends_on:
      - elasticsearch

    networks:
      - employee-network


# ============================================================
